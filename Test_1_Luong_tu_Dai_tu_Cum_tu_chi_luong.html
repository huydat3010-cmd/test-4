<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#17212b;line-height:1.55;overflow-x:hidden}button,input{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.wrap{width:min(900px,100%);margin:0 auto;padding:16px 14px calc(34px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:24px 20px;text-align:center;margin-top:10px}.brand{font-weight:800;color:var(--blue);font-size:13px;letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:clamp(23px,6vw,34px);line-height:1.18;margin:8px 0 10px;color:var(--ink)}.subtitle{color:var(--muted);margin:0 auto 18px;max-width:700px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;text-align:left}.meta div{padding:12px;border-radius:12px;background:var(--soft)}.meta b{display:block;color:var(--ink);font-size:13px}.guide{padding:14px 16px;border-left:4px solid var(--blue2);background:#f1f8fd;text-align:left;border-radius:10px;margin:16px 0}.field{text-align:left;margin:18px 0 12px}.field label{display:block;font-weight:800;margin-bottom:7px;color:var(--ink)}.field input{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid #b8c9d6;border-radius:12px;font-size:16px;background:white;outline:none}.field input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(20,120,184,.12)}.btn{border:0;border-radius:13px;min-height:52px;padding:12px 18px;font-weight:800;cursor:pointer;width:100%}.btn-primary{background:var(--blue);color:white}.btn-secondary{background:white;color:var(--blue);border:1.5px solid var(--blue)}.btn-ghost{background:#edf3f7;color:var(--ink)}.error{color:var(--bad);font-weight:700;margin:8px 0 0}.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:20;background:rgba(244,248,251,.96);backdrop-filter:blur(8px);padding:8px 0 10px}.topbar-inner{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.quiz-title{font-weight:900;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--blue);background:white;border:1px solid var(--line);border-radius:999px;padding:7px 10px}.progress{height:8px;background:#dce9f2;border-radius:99px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:var(--blue2);width:0;transition:width .2s}.section{margin:18px 0}.section-head{padding:16px 16px 10px}.section-head h2{font-size:19px;margin:0;color:var(--ink)}.section-head p{margin:4px 0 0;color:var(--muted)}.block{padding:16px;margin:12px 0}.passage{white-space:pre-line;background:#f7fafc;border:1px solid #e1ebf2;border-radius:12px;padding:14px;margin-bottom:14px;font-size:16px}.question{border-top:1px dashed #d8e3eb;padding:16px 0 4px}.question:first-of-type{border-top:0;padding-top:2px}.q-title{font-weight:900;color:var(--ink);margin-bottom:7px}.stem{margin:0 0 10px;font-weight:700}.options{display:grid;gap:10px}.option{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;width:100%;min-height:56px;text-align:left;border:1.5px solid #cbd9e4;background:white;border-radius:13px;padding:7px 10px;cursor:pointer;color:#17212b}.option:hover{border-color:#8bb8d4}.option.selected{border-color:var(--blue2);background:#edf7fd;box-shadow:0 0 0 2px rgba(20,120,184,.08)}.option .letter{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#e9f1f6;color:var(--ink);font-weight:900}.option.selected .letter{background:var(--blue);color:white}.submit-wrap{position:sticky;bottom:0;padding:10px 0 max(10px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(244,248,251,0));z-index:12}.status-msg{background:#fff8e5;color:var(--warn);border:1px solid #f0d48a;border-radius:12px;padding:12px 14px;margin:8px 0;font-weight:700}.result{padding:20px;margin-top:14px}.scoreline{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.scorebox{background:#f5f9fc;border:1px solid var(--line);border-radius:14px;padding:14px}.scorebox b{display:block;font-size:13px;color:var(--muted)}.scorebig{font-size:34px;font-weight:950;color:var(--blue);line-height:1.05}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.history{margin-top:18px}.history h3{margin:0 0 8px;color:var(--ink)}.history-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.history table{width:100%;border-collapse:collapse;min-width:520px}.history th,.history td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.review{margin-top:18px}.review-card{padding:15px;margin:10px 0}.review-card.good{border-left:5px solid var(--ok)}.review-card.bad{border-left:5px solid var(--bad)}.review-card h4{margin:0 0 9px;color:var(--ink)}.review-row{margin:5px 0}.correct{color:var(--ok);font-weight:800}.wrong{color:var(--bad);font-weight:800}.explain{background:#f7fafc;border-radius:11px;padding:11px;margin-top:9px}.rule{background:#fff8e8;border-radius:11px;padding:11px;margin-top:8px}.tiny{font-size:13px;color:var(--muted)}

<body>
<div class="wrap">
  <section id="landing" class="card hero">
    <div class="brand">English Practice • Offline Quiz</div>
    <h1 id="landingTitle"></h1>
    <p class="subtitle" id="landingSubtitle"></p>
    <div class="meta"><div><b>Teacher</b><span id="teacher"></span></div><div><b>School</b><span id="school"></span></div></div>
    <div class="guide">Em hoàn thành bài trên giấy trước, sau đó nhập đáp án vào hệ thống để kiểm tra.</div>

  </section>

<script>
const TEST={"id":"quantifier_pronoun_phrases_test_1","title":"LƯỢNG TỪ, ĐẠI TỪ VÀ CỤM TỪ CHỈ LƯỢNG — ĐỀ SỐ 01","shortTitle":"Đề số 01","subtitle":"Bài kiểm tra gồm 30 câu giúp củng cố cách dùng lượng từ, đại từ và các cụm từ chỉ lượng trong ngữ cảnh.","teacher":"Lê Thị Thanh Hà","school":"THPT A Phủ Lý","sections":[{"title":"PHẦN A — HOÀN THÀNH ĐOẠN VĂN","instruction":"Chọn đáp án đúng để hoàn thành đoạn văn.","blocks":[{"passage":"(1) _______ people learn a foreign language to improve job prospects or travel with ease. In reality, learning a language offers more than just communication skills. Since (2) ______ language is born with its own culture, you gain insights into a(n) (3) _______ of ways of thinking and living.","questions":[{"n":1,"options":["Most","Much","Every","No"],"answer":"Most","correction":"Most people learn a foreign language to improve job prospects or travel with ease.","explanation":"“Most + plural countable noun” means the majority of a group. “People” is plural and no article is needed before “most” here.","rule":"Most + plural countable noun."},{"n":2,"options":["little","other","almost","every"],"answer":"every","correction":"Since every language is born with its own culture, you gain insights into a variety of ways of thinking and living.","explanation":"“Every” is followed by a singular countable noun and refers to all members individually. “Language” is singular.","rule":"Every + singular countable noun."},{"n":3,"options":["amount","variety","degree","lack"],"answer":"variety","correction":"...you gain insights into a variety of ways of thinking and living.","explanation":"The fixed phrase “a variety of” means many different types or forms. It fits the plural noun “ways”.","rule":"a variety of + plural noun."}]},{"passage":"Naturally, the (4) _______ of business activities aim at making profit. However, today, as people care more about sustainability and fairness, a (5) _______ of attention is paid to social responsibility. (6) _______ companies are starting to go green, reduce waste, or improve conditions for workers.","questions":[{"n":4,"options":["percentage","number","majority","amount"],"answer":"majority","correction":"Naturally, the majority of business activities aim at making profit.","explanation":"“The majority of + plural noun” means most members of a group. “Business activities” is plural.","rule":"the majority of + plural noun."},{"n":5,"options":["range","handful","number","great deal"],"answer":"great deal","correction":"...a great deal of attention is paid to social responsibility.","explanation":"“Attention” is uncountable, so “a great deal of” is the suitable quantifier.","rule":"a great deal of + uncountable noun."},{"n":6,"options":["A lot of","No","Few","Each"],"answer":"A lot of","correction":"A lot of companies are starting to go green, reduce waste, or improve conditions for workers.","explanation":"“A lot of” can modify plural countable nouns such as “companies” and matches the positive meaning of the sentence.","rule":"a lot of + plural countable noun / uncountable noun."}]},{"passage":"Every year, a large (7) _______ of sea turtles come to this beach to lay their eggs. However, it’s a harsh process filled with danger. When the baby turtles hatch, they face threats from crabs, birds, and (8) _______ predators. As a result, only a small (9) _______ of them manage to return safely to the sea.","questions":[{"n":7,"options":["number","deal","level","piece"],"answer":"number","correction":"Every year, a large number of sea turtles come to this beach to lay their eggs.","explanation":"“Sea turtles” is a plural countable noun, so the standard phrase is “a large number of”.","rule":"a large number of + plural countable noun."},{"n":8,"options":["other","another","the others","others"],"answer":"other","correction":"...they face threats from crabs, birds, and other predators.","explanation":"“Other” functions as a determiner before the plural noun “predators”. “Others” cannot directly modify a noun.","rule":"other + plural noun; others = pronoun."},{"n":9,"options":["proportion","amount","piece","lack"],"answer":"proportion","correction":"As a result, only a small proportion of them manage to return safely to the sea.","explanation":"“A small proportion of” means a small percentage/part of a group and naturally takes “of them”.","rule":"a small proportion of + plural group."}]},{"passage":"The school’s annual sports festival will take place next week with a wide (10) _______ of exciting activities. (11) _______ students from every class must attend and take part in the event. Those who join the competitions must arrive early and follow the rules carefully. (12) _______ will cheer for their teams, bring posters or wear matching colours to show support and school spirit.","questions":[{"n":10,"options":["degree","piece","range","plenty"],"answer":"range","correction":"...with a wide range of exciting activities.","explanation":"“A wide range of” is a fixed phrase meaning many different types of something.","rule":"a wide range of + plural noun."},{"n":11,"options":["All","Each","Much","A little"],"answer":"All","correction":"All students from every class must attend and take part in the event.","explanation":"“All” can directly modify a plural countable noun. “Each” would require singular “student”.","rule":"all + plural noun; each + singular noun."},{"n":12,"options":["The other","The others","Another","Other"],"answer":"The others","correction":"The others will cheer for their teams, bring posters or wear matching colours to show support and school spirit.","explanation":"After mentioning the students who join competitions, “the others” refers to the remaining students as a pronoun.","rule":"the others = the remaining people/things; no noun follows."}]},{"passage":"Nowadays, we have access to a vast (13) _______ of information online. Fortunately, (14) _______ all of the content is free and even expected to be shared widely. However, there are a (15) _______ of risks to consider. For example, you may come across either negative content (16) _______ fake news, both of which can influence your thoughts and emotions negatively. Some people become overwhelmed or misled, leading to confusion or anxiety.","questions":[{"n":13,"options":["pair","amount","number","range"],"answer":"amount","correction":"Nowadays, we have access to a vast amount of information online.","explanation":"“Information” is uncountable, so “amount” is used rather than “number”.","rule":"an amount of + uncountable noun."},{"n":14,"options":["some","many","most","almost"],"answer":"almost","correction":"Fortunately, almost all of the content is free and even expected to be shared widely.","explanation":"“Almost all” means nearly 100%. “Most all” is not the intended standard structure here.","rule":"almost all (of) + noun/pronoun."},{"n":15,"options":["couple","level","scarcity","lack"],"answer":"couple","correction":"However, there are a couple of risks to consider.","explanation":"“A couple of” is followed by a plural countable noun and means two or a small number.","rule":"a couple of + plural countable noun."},{"n":16,"options":["few","and","or","nor"],"answer":"or","correction":"...you may come across either negative content or fake news...","explanation":"The correlative conjunction is “either ... or ...”.","rule":"either ... or ..."}]},{"passage":"The disappearance of a single species can trigger a (17) _______ of negative impacts on the ecosystem. For instance, when all bees vanish, there will be a(n) (18) _______ of pollinated plants, leading to a shortage of food. This definitely affects (19) _______ animals that depend on those plants to survive. Therefore, (20) _______ species—whether insects or predators—plays an important role in maintaining ecological balance.","questions":[{"n":17,"options":["series","volume","piece","degree"],"answer":"series","correction":"The disappearance of a single species can trigger a series of negative impacts on the ecosystem.","explanation":"“A series of” means a sequence or chain of related events/effects and fits “negative impacts”.","rule":"a series of + plural noun."},{"n":18,"options":["wealth","amount","number","scarcity"],"answer":"scarcity","correction":"...there will be a scarcity of pollinated plants, leading to a shortage of food.","explanation":"“Scarcity” means a shortage or insufficient supply, which matches the consequence of bees vanishing.","rule":"a scarcity of + noun = a shortage of."},{"n":19,"options":["other","another","the others","others"],"answer":"other","correction":"This definitely affects other animals that depend on those plants to survive.","explanation":"“Other” is used before the plural noun “animals”.","rule":"other + plural noun."},{"n":20,"options":["another","almost","every","no"],"answer":"every","correction":"Therefore, every species—whether insects or predators—plays an important role in maintaining ecological balance.","explanation":"“Every” takes a singular noun and a singular verb: “every species ... plays”.","rule":"every + singular noun + singular verb."}]},{"passage":"The (21) _______ of concentration can be affected by some factors you may not even notice. One major factor is noise, which can distract you from your current tasks. Therefore, try to work in a place with as (22) _______ noise as possible. (23) _______ common factor is poor lighting, which strains your eyes and causes fatigue. (24) _______ minor factors include uncomfortable chairs or an untidy desk. Though small, these issues can slowly lower your focus over time if not addressed properly.","questions":[{"n":21,"options":["number","host","level","minority"],"answer":"level","correction":"The level of concentration can be affected by some factors you may not even notice.","explanation":"“Level of concentration” is the natural collocation for the degree/intensity of concentration.","rule":"the level of + uncountable/abstract noun."},{"n":22,"options":["little","much","many","few"],"answer":"little","correction":"Therefore, try to work in a place with as little noise as possible.","explanation":"“Noise” is uncountable. In the comparison pattern “as ... as possible”, use “little” for a small amount.","rule":"as little + uncountable noun + as possible."},{"n":23,"options":["The others","Others","The other","Another"],"answer":"Another","correction":"Another common factor is poor lighting, which strains your eyes and causes fatigue.","explanation":"“Another” means one more/additional and is followed by a singular countable noun: “factor”.","rule":"another + singular countable noun."},{"n":24,"options":["Some","Each","A little","Others"],"answer":"Some","correction":"Some minor factors include uncomfortable chairs or an untidy desk.","explanation":"“Some” can directly modify the plural countable noun “factors”.","rule":"some + plural countable noun / uncountable noun."}]}]},{"title":"PHẦN B — SẮP XẾP VĂN BẢN","instruction":"Chọn đáp án chỉ ra thứ tự sắp xếp đúng để tạo thành văn bản hoàn chỉnh.","blocks":[{"passage":"a. The rise of artificial intelligence is reshaping the job market.\nb. In particular, routine tasks may disappear, but roles requiring creativity, emotional intelligence, and problem-solving will grow.\nc. While some fear that AI will replace human workers, many experts believe it will also create new opportunities.","questions":[{"n":25,"stem":"Thứ tự đúng là:","options":["a – c – b","a – b – c","c – b – a","b – a – c"],"answer":"a – c – b","correction":"The rise of artificial intelligence is reshaping the job market. While some fear that AI will replace human workers, many experts believe it will also create new opportunities. In particular, routine tasks may disappear, but roles requiring creativity, emotional intelligence, and problem-solving will grow.","explanation":"Sentence a introduces the topic. Sentence c presents the general contrast between job loss and new opportunities. Sentence b then specifies the kinds of jobs likely to change or grow.","rule":"Topic sentence → general development/contrast → specific detail."}]},{"passage":"a. People believe that this action shows disrespect because feet are considered the lowest and dirtiest part of the body.\nb. This can be explained by traditional Asian values.\nc. In Vietnam, pointing your feet toward elders or altars is a taboo.\nd. They emphasise hierarchy, respect, and the sacredness of worship spaces.","questions":[{"n":26,"stem":"Thứ tự đúng là:","options":["b – c – d – a","a – c – d – b","c – a – b – d","d – c – b – a"],"answer":"c – a – b – d","correction":"In Vietnam, pointing your feet toward elders or altars is a taboo. People believe that this action shows disrespect because feet are considered the lowest and dirtiest part of the body. This can be explained by traditional Asian values. They emphasise hierarchy, respect, and the sacredness of worship spaces.","explanation":"Sentence c introduces the taboo. Sentence a uses “this action” to refer back to pointing the feet. Sentence b explains the cultural reason, and sentence d uses “They” to refer to “traditional Asian values”.","rule":"Track reference words: this action → previous action; They → previous plural noun phrase."}]},{"passage":"a. Vocational pathways focus on practical skills and prepare students for specific careers.\nb. When choosing a future path, students often face a tough decision between vocational and academic options.\nc. They can lead to professions like law or medicine, but also come with higher costs and time investment.\nd. They offer hands-on training, and many find work right after graduation.\ne. Academic pathways, on the other hand, emphasise theory and often require years of study.","questions":[{"n":27,"stem":"Thứ tự đúng là:","options":["c – a – d – e – b","b – a – e – c – d","e – a – c – b – d","b – a – d – e – c"],"answer":"b – a – d – e – c","correction":"When choosing a future path, students often face a tough decision between vocational and academic options. Vocational pathways focus on practical skills and prepare students for specific careers. They offer hands-on training, and many find work right after graduation. Academic pathways, on the other hand, emphasise theory and often require years of study. They can lead to professions like law or medicine, but also come with higher costs and time investment.","explanation":"Sentence b introduces the two options. Sentences a and d develop the vocational pathway. “On the other hand” in e shifts to the academic pathway, and c continues that pathway with “They”.","rule":"Introduction → option 1 + detail → contrast marker → option 2 + detail."}]}]},{"title":"PHẦN C — XÁC ĐỊNH TỪ QUY CHIẾU","instruction":"Chọn đáp án đúng cho từ quy chiếu trong mỗi đoạn văn.","blocks":[{"passage":"Platforms like Facebook and Twitter were once places to share updates with friends; now, they are powerful media outlets. They use algorithms to control what users see, which influences opinions and behaviors. Newer platforms like TikTok focus more on entertainment and short-form video, changing how people consume content.","questions":[{"n":28,"stem":"The word “They” refers to _______.","options":["Platforms","Updates","Friends","Algorithms"],"answer":"Platforms","correction":"“They” refers to platforms like Facebook and Twitter.","explanation":"The plural pronoun “They” refers back to the nearest logical plural subject, “Platforms like Facebook and Twitter”.","rule":"Match pronoun number and meaning with the antecedent."}]},{"passage":"Many zoos also run breeding programs to increase animal populations. While some critics argue that keeping animals in captivity is cruel, modern zoos focus on animal welfare and natural habitats. They also educate the public about biodiversity and environmental protection.","questions":[{"n":29,"stem":"The word “They” refers to _______.","options":["Some critics","Breeding programs","Modern zoos","Animal populations"],"answer":"Modern zoos","correction":"“They” refers to modern zoos.","explanation":"The sentence immediately before the pronoun has “modern zoos” as its main plural subject, and educating the public is an action performed by zoos.","rule":"Choose the grammatically matching and logically possible antecedent."}]},{"passage":"Researching different fields, trying internships, and talking to professionals can make the decision clearer. A career is not just a job—it’s a big part of your life. If it doesn’t fit you, it may cause stress and regret later. So take your time, and let your choice reflect who you truly are.","questions":[{"n":30,"stem":"The word “it” refers to _______.","options":["the decision","a career","your life","stress"],"answer":"a career","correction":"In “If it doesn’t fit you, it may cause stress...”, “it” refers to a career.","explanation":"The preceding sentence makes “a career” the central singular noun. The meaning “a career doesn’t fit you” is also logically coherent.","rule":"Use both grammatical agreement and context to identify reference."}]}]}]};
const NAME_KEY='englishQuiz.studentName';
const HISTORY_KEY='englishQuiz.history.'+TEST.id;
let attemptNo=1, startedAt=0, timerHandle=null, answerState={}, renderMap={};
const $=s=>document.querySelector(s);
const letters=['A','B','C','D'];
const MEM={};
function storeGet(k){try{return localStorage.getItem(k)}catch(e){return Object.prototype.hasOwnProperty.call(MEM,k)?MEM[k]:null}}
function storeSet(k,v){try{localStorage.setItem(k,v)}catch(e){MEM[k]=String(v)}}
function getHistory(){try{return JSON.parse(storeGet(HISTORY_KEY)||'[]')}catch(e){return[]}}
function saveHistory(h){storeSet(HISTORY_KEY,JSON.stringify(h))}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function changedShuffle(arr,key){if(arr.length<2)return arr.slice();const base=arr.map(key).join('|');let out=shuffle(arr);if(out.map(key).join('|')===base)out=out.slice(1).concat(out[0]);return out}
function optionOrder(q){return attemptNo===1?q.options.slice():changedShuffle(q.options,x=>x)}
function init(){
  $('#landingTitle').textContent=TEST.title; $('#landingSubtitle').textContent=TEST.subtitle; $('#teacher').textContent=TEST.teacher; $('#school').textContent=TEST.school;
  $('#studentName').value=storeGet(NAME_KEY)||'';
  const h=getHistory(); if(h.length){const x=h[h.length-1]; const box=$('#lastScore'); box.className='guide'; box.innerHTML='<b>Lần làm gần nhất:</b> '+escapeHTML(x.score.toFixed(1))+'/10 • '+x.correct+'/30 câu đúng • '+escapeHTML(x.duration);}
}
function prepareSections(){
  return TEST.sections.map(sec=>{
    let blocks=sec.blocks.slice(); if(attemptNo>1) blocks=changedShuffle(blocks,b=>b.questions.map(q=>q.n).join(','));
    return {...sec,blocks:blocks.map(b=>{let qs=b.questions.slice();if(attemptNo>1&&qs.length>1)qs=changedShuffle(qs,q=>q.n);return {...b,questions:qs}})};
  });
}
function startQuiz(){
  const name=$('#studentName').value.trim(); if(!name){$('#nameError').classList.remove('hidden');$('#studentName').focus();return}
  $('#nameError').classList.add('hidden'); storeSet(NAME_KEY,name);
  attemptNo=getHistory().length+1; answerState={};renderMap={}; startedAt=Date.now();
  $('#landing').classList.add('hidden');$('#resultScreen').classList.add('hidden');$('#quizScreen').classList.remove('hidden');$('#quizTitle').textContent=TEST.shortTitle+' • Lần '+attemptNo;
  renderQuiz(); updateProgress(); clearInterval(timerHandle); $('#timer').textContent='00:00'; timerHandle=setInterval(()=>$('#timer').textContent=fmtTime((Date.now()-startedAt)/1000),1000); window.scrollTo(0,0);
}
function renderQuiz(){
  const root=$('#quizRoot');root.innerHTML='';
  prepareSections().forEach(sec=>{
    const secEl=document.createElement('section');secEl.className='section';
    secEl.innerHTML='<div class="section-head"><h2>'+escapeHTML(sec.title)+'</h2><p>'+escapeHTML(sec.instruction)+'</p></div>';
    sec.blocks.forEach(block=>{
      const blockEl=document.createElement('div');blockEl.className='card block';
      const passage=document.createElement('div');passage.className='passage';passage.textContent=block.passage;blockEl.appendChild(passage);
      block.questions.forEach(q=>{
        const opts=optionOrder(q);renderMap[q.n]={q:q,options:opts};
        const qEl=document.createElement('div');qEl.className='question';qEl.id='q-'+q.n;
        let inner='<div class="q-title">Câu '+q.n+'</div>'+(q.stem?'<div class="stem">'+escapeHTML(q.stem)+'</div>':'');
        inner+='<div class="options">'+opts.map((opt,i)=>'<button type="button" class="option" data-q="'+q.n+'" data-opt="'+escapeHTML(opt)+'"><span class="letter">'+letters[i]+'</span><span>'+escapeHTML(opt)+'</span></button>').join('')+'</div>';
        qEl.innerHTML=inner;blockEl.appendChild(qEl);
      });
      secEl.appendChild(blockEl);
    });
    root.appendChild(secEl);
  });
  root.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>selectAnswer(btn)));
}
function selectAnswer(btn){
  const n=Number(btn.dataset.q),opt=btn.dataset.opt; answerState[n]=opt;
  document.querySelectorAll('.option[data-q="'+n+'"]').forEach(x=>x.classList.toggle('selected',x===btn));updateProgress();
}
function updateProgress(){const done=Object.keys(answerState).length;$('#progressBar').style.width=(done/30*100)+'%'}
function submitQuiz(){
  const unanswered=[];for(let i=1;i<=30;i++)if(!answerState[i])unanswered.push(i);
  if(unanswered.length){const m=$('#submitMsg');m.textContent='Em còn '+unanswered.length+' câu chưa chọn đáp án: '+unanswered.slice(0,10).join(', ')+(unanswered.length>10?'...':'')+'.';m.classList.remove('hidden');const target=$('#q-'+unanswered[0]);if(target)target.scrollIntoView({behavior:'smooth',block:'center'});return}
  $('#submitMsg').classList.add('hidden');clearInterval(timerHandle);
  const seconds=Math.round((Date.now()-startedAt)/1000);let correct=0;for(let i=1;i<=30;i++){if(answerState[i]===renderMap[i].q.answer)correct++}
  const score=Math.round((correct/30*10)*10)/10;const history=getHistory();history.push({attempt:history.length+1,score:score,correct:correct,duration:fmtTime(seconds),at:new Date().toLocaleString('vi-VN')});saveHistory(history);
  $('#quizScreen').classList.add('hidden');$('#resultScreen').classList.remove('hidden');renderResult(score,correct,seconds,history);window.scrollTo(0,0);
}
function renderResult(score,correct,seconds,history){
  const name=storeGet(NAME_KEY)||'';const last=history[history.length-1];
  $('#resultCard').innerHTML='<div class="brand">KẾT QUẢ LẦN GẦN NHẤT</div><h2 style="margin:6px 0;color:var(--ink)">'+escapeHTML(TEST.shortTitle)+'</h2><div class="tiny">'+escapeHTML(name)+' • '+escapeHTML(TEST.teacher)+' • '+escapeHTML(TEST.school)+'</div><div class="scoreline"><div class="scorebox"><b>Điểm</b><div class="scorebig">'+score.toFixed(1)+'/10</div></div><div class="scorebox"><b>Số câu đúng</b><div class="scorebig">'+correct+'/30</div></div><div class="scorebox"><b>Thời gian</b><strong>'+fmtTime(seconds)+'</strong></div><div class="scorebox"><b>Lần làm</b><strong>'+last.attempt+'</strong></div></div><div class="result-actions"><button id="reviewBtn" class="btn btn-secondary" type="button">XEM ĐÁP ÁN & GIẢI CHI TIẾT</button><button id="retryBtn" class="btn btn-primary" type="button">LÀM LẠI</button></div><div class="history"><h3>Lịch sử làm bài</h3><div class="history-scroll"><table><thead><tr><th>Lần</th><th>Điểm</th><th>Đúng</th><th>Thời gian</th><th>Ngày giờ</th></tr></thead><tbody>'+history.map(x=>'<tr><td>'+x.attempt+'</td><td><b>'+x.score.toFixed(1)+'</b></td><td>'+x.correct+'/30</td><td>'+escapeHTML(x.duration)+'</td><td>'+escapeHTML(x.at)+'</td></tr>').join('')+'</tbody></table></div></div>';
  $('#reviewBtn').addEventListener('click',showReview);$('#retryBtn').addEventListener('click',startQuiz);$('#review').classList.add('hidden');$('#review').innerHTML='';
}
function showReview(){
  const review=$('#review'); if(review.innerHTML){review.classList.toggle('hidden');return}
  let html='<div class="section-head"><h2>ĐÁP ÁN & GIẢI CHI TIẾT</h2><p>Đối chiếu đáp án của em với đáp án đúng.</p></div>';
  for(let n=1;n<=30;n++){
    const m=renderMap[n],q=m.q,chosen=answerState[n],ok=chosen===q.answer,correctIndex=m.options.indexOf(q.answer),chosenIndex=m.options.indexOf(chosen);
    html+='<div class="card review-card '+(ok?'good':'bad')+'"><h4>Câu '+n+' — '+(ok?'Đúng':'Chưa đúng')+'</h4><div class="review-row correct">Đáp án đúng: '+letters[correctIndex]+'. '+escapeHTML(q.answer)+'</div><div class="review-row '+(ok?'correct':'wrong')+'">Em chọn: '+letters[chosenIndex]+'. '+escapeHTML(chosen)+'</div><div class="review-row"><b>Câu hoàn chỉnh:</b> '+escapeHTML(q.correction)+'</div><div class="explain"><b>Giải thích:</b> '+escapeHTML(q.explanation)+'</div><div class="rule"><b>Quy tắc nhớ nhanh:</b> '+escapeHTML(q.rule)+'</div></div>';
  }
  review.innerHTML=html;review.classList.remove('hidden');review.scrollIntoView({behavior:'smooth',block:'start'});
}
$('#startBtn').addEventListener('click',startQuiz);$('#submitBtn').addEventListener('click',submitQuiz);$('#studentName').addEventListener('keydown',e=>{if(e.key==='Enter')startQuiz()});init();
</script>
</body></html>
